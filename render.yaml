services:
  # ---------------------------------------------------------------------------
  # 1. Express Backend Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: web-feedback-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: MAILTRAP_TOKEN
        sync: false
      - key: SENDER_EMAIL
        value: "hello@productdesign.rockbot.com"
      - key: SENDER_NAME
        value: "Prototype Feedback"
      - key: ADMIN_EMAIL
        value: "ryan.mccarthy@rockbot.com"
      - key: SLACK_WEBHOOK_URL
        sync: false

  # ---------------------------------------------------------------------------
  # 2. Frontend Demo Static Site
  # ---------------------------------------------------------------------------
  - type: static
    name: web-feedback-demo
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:client
    staticPublishPath: packages/client/dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
